<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f2efe8">
  <title>RhymePad · RhymeLab Local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/pad/assets/styles.css">
</head>
<body>
  <header class="topbar pad-topbar">
    <div class="topbar-inner pad-topbar-inner">
      <a class="brand" href="/" aria-label="RhymeLab home">
        <span class="brand-mark">R</span>
        <span>RhymeLab</span>
        <small>LOCAL</small>
      </a>
      <div class="pad-product-label">
        <strong>RhymePad</strong>
        <span>LYRIC WORKSPACE</span>
      </div>
      <div class="pad-top-actions">
        <a class="pad-nav-link" href="/">Search</a>
        <a class="pad-nav-link active" href="/pad" aria-current="page">RhymePad</a>
        <div class="language-switch pad-language-switch" aria-label="Search language basis">
          <button type="button" data-basis="de" class="basis-option">DE</button>
          <button type="button" data-basis="en" class="basis-option">EN</button>
          <button type="button" data-basis="both" class="basis-option">DE+EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="pad-shell">
    <section class="pad-songbar">
      <div class="song-title-wrap">
        <span class="eyebrow">CURRENT LYRIC</span>
        <input id="songTitle" class="song-title" value="Untitled" aria-label="Song title">
      </div>
      <label class="folder-field">
        <span>Folder</span>
        <input id="songFolder" value="Unfiled" aria-label="Song folder">
      </label>
      <div class="song-stats" id="songStats" aria-live="polite"></div>
      <div class="save-state" id="saveState">Saved locally</div>
      <button class="quiet-button" id="toggleLibrary" type="button">Library</button>
    </section>

    <nav class="mode-tabs" aria-label="RhymePad mode">
      <button type="button" class="mode-tab active" data-mode="write">
        <strong>WRITE</strong><span>Write with quiet live rhyme help</span>
      </button>
      <button type="button" class="mode-tab" data-mode="rhyme">
        <strong>RHYME</strong><span>Deep RhymeLab search while you write</span>
      </button>
      <button type="button" class="mode-tab" data-mode="perform">
        <strong>PERFORM</strong><span>Delivery, accents, pauses and holds</span>
      </button>
    </nav>

    <div class="pad-workbench" id="workbench" data-mode="write">
      <aside class="library-panel card-panel" id="libraryPanel">
        <div class="panel-heading">
          <div><span class="eyebrow">LIBRARY</span><h2>Lyrics</h2></div>
          <button class="icon-button" id="newSong" type="button" title="New lyric">+</button>
        </div>
        <label class="library-search-label">
          <span>Find</span>
          <input id="librarySearch" type="search" placeholder="Search lyrics…">
        </label>
        <div class="library-tabs">
          <button type="button" class="library-tab active" data-library-view="active">Active</button>
          <button type="button" class="library-tab" data-library-view="trash">Trash</button>
        </div>
        <div id="libraryList" class="library-list"></div>
        <div class="library-actions">
          <button id="deleteSong" class="quiet-button danger" type="button">Move to Trash</button>
          <button id="restoreSong" class="quiet-button hidden" type="button">Restore</button>
        </div>
      </aside>

      <section class="editor-panel card-panel" id="editorPanel">
        <div class="panel-heading editor-heading">
          <div>
            <span class="eyebrow" id="editorEyebrow">WRITE</span>
            <h2 id="editorHeading">Stay in the lyric.</h2>
          </div>
          <div class="editor-controls">
            <label>Size
              <select id="fontSize">
                <option>16</option><option selected>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>40</option><option>48</option><option>56</option><option>64</option>
              </select>
            </label>
          </div>
        </div>
        <div class="editor-frame">
          <div id="barRail" class="bar-rail" aria-hidden="true"></div>
          <textarea id="lyricsEditor" spellcheck="true" placeholder="Write a line. One logical bar per line…" aria-label="Lyrics editor"></textarea>
        </div>
        <div class="editor-footer">
          <span id="cursorReadout">Bar 1</span>
          <span id="liveQueryReadout">Rhyme assist follows the word at your cursor.</span>
        </div>
      </section>

      <aside class="assist-panel card-panel" id="assistPanel">
        <div class="panel-heading assist-heading">
          <div><span class="eyebrow">RHYME ASSIST</span><h2 id="assistHeading">Best of RhymeLab</h2></div>
          <span class="live-dot" title="Local live search"></span>
        </div>
        <div class="assist-query-row">
          <input id="rhymeQuery" type="search" autocomplete="off" spellcheck="false" placeholder="Current word or selected phrase…">
          <label class="follow-toggle"><input id="followCursor" type="checkbox" checked> Follow cursor</label>
        </div>
        <div class="assist-filters">
          <label>Show
            <select id="assistPreset">
              <option value="best">Best of everything</option>
              <option value="words">Words only</option>
              <option value="phrases">Phrases / Mosaic only</option>
              <option value="entities">Entities only</option>
              <option value="multisyllabic_perfect">Multisyllabic perfect</option>
              <option value="perfect">Perfect rhyme</option>
              <option value="multisyllabic_slant">Multisyllabic slant</option>
              <option value="family">Rhyme family</option>
              <option value="slant">Slant rhyme</option>
              <option value="assonance">Assonance</option>
              <option value="consonance">Consonance</option>
            </select>
          </label>
          <label class="rhyme-only-control">Scope
            <select id="rhymeScope">
              <option value="all">Words + phrases + entities</option>
              <option value="words">Words</option>
              <option value="phrases">Phrases / Mosaic</option>
              <option value="entities">Entities</option>
            </select>
          </label>
          <label class="rhyme-only-control">Relation
            <select id="rhymeType">
              <option value="all">All</option>
              <option value="multisyllabic_perfect">Multisyllabic perfect</option>
              <option value="perfect">Perfect rhyme</option>
              <option value="multisyllabic_slant">Multisyllabic slant</option>
              <option value="family">Rhyme family</option>
              <option value="slant">Slant rhyme</option>
              <option value="assonance">Assonance</option>
              <option value="consonance">Consonance</option>
            </select>
          </label>
          <label class="entity-filter-control">Entity category
            <select id="entityCategory">
              <option value="all">All entities</option>
              <optgroup label="People">
                <option value="person.rapper">Rapper</option>
                <option value="person.musician">Musicians</option>
                <option value="person.actor">Actors</option>
                <option value="person.director">Directors</option>
              </optgroup>
              <optgroup label="Music / culture">
                <option value="group.music_group">Bands / music groups</option>
                <option value="work.song">Songs</option>
                <option value="work.album">Albums</option>
                <option value="work.film">Films</option>
                <option value="work.video_game">Games</option>
                <option value="fictional.character">Fictional characters</option>
              </optgroup>
              <optgroup label="Brands / organizations">
                <option value="organization.car_brand">Car brands</option>
                <option value="organization.fashion_house">Fashion houses</option>
                <option value="organization.company">Companies</option>
              </optgroup>
            </select>
          </label>
        </div>
        <div id="assistStatus" class="assist-status">Type in the editor to start local rhyme search.</div>
        <div id="rhymeResults" class="rhyme-results"></div>
      </aside>

      <section class="perform-panel card-panel" id="performPanel" aria-label="Performance score">
        <div class="panel-heading">
          <div><span class="eyebrow">PERFORM</span><h2>Lyric-native delivery score</h2></div>
          <label class="bpm-field">BPM <input id="bpmInput" type="number" min="40" max="240" value="92"></label>
        </div>
        <div class="cue-toolbar" id="cueToolbar" aria-label="Performance tools">
          <button type="button" class="cue-button active" data-cue="move">Move</button>
          <button type="button" class="cue-button" data-cue="accent">Accent</button>
          <button type="button" class="cue-button" data-cue="pause">Pause</button>
          <button type="button" class="cue-button" data-cue="breath">Breath</button>
          <button type="button" class="cue-button" data-cue="hold">Hold</button>
          <button type="button" class="cue-button" data-cue="erase">Erase</button>
        </div>
        <div id="performScore" class="perform-score"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/pad/assets/app.js"></script>
</body>
</html>

name: React Studio Replatform

on:
  pull_request:
    paths:
      - 'apps/studio-react/**'
      - 'packages/shared-core/**'
      - 'packages/platform-web/**'
      - 'scripts/check-react-shared-core-boundary.mjs'
      - 'scripts/check-react-studio-parity.mjs'
      - 'scripts/check-react-studio-r10.mjs'
      - 'src/react-studio-preview.mjs'
      - 'src/server.mjs'
      - 'tests/react-studio-preview.test.mjs'
      - 'tests/react-studio-legacy-exit.test.mjs'
      - 'docs/REACT_STUDIO_REPLATFORM.md'
      - 'docs/REACT_STUDIO_PARITY_GATE.md'
      - 'package.json'
      - '.github/workflows/react-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.x'

      - name: Validate parity inventory
        run: node scripts/check-react-studio-parity.mjs

      - name: Enforce Shared Core boundary
        run: node scripts/check-react-shared-core-boundary.mjs

      - name: Install locked React Studio dependencies
        run: npm ci --prefix apps/studio-react --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm --prefix apps/studio-react run typecheck

      - name: Test
        run: npm --prefix apps/studio-react run test

      - name: Build
        run: npm --prefix apps/studio-react run build

      - name: React asset serving + R10 Legacy Exit contract
        run: node --test tests/react-studio-preview.test.mjs tests/react-studio-legacy-exit.test.mjs

      - name: R10 Legacy Exit source gate
        run: node scripts/check-react-studio-r10.mjs

      - name: Install Playwright acceptance runner
        working-directory: apps/studio-react/browser-acceptance
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Chromium for R10 browser acceptance
        working-directory: apps/studio-react/browser-acceptance
        run: npx playwright install --with-deps chromium

      - name: R10 automated browser acceptance
        working-directory: apps/studio-react/browser-acceptance
        run: npx playwright test --config playwright.config.ts

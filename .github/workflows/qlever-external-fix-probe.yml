name: QLever External Fix Probe

on:
  push:
    branches: [fix-qlever-gzip-stage-reader]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe corrected external-ID query
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { buildQLeverEntityQueries } from './scripts/qlever-entity-source-core.mjs';

          const taxonomy=JSON.parse(await readFile('sources/entity/wikidata-entity-taxonomy-v1.json','utf8'));
          const spec=buildQLeverEntityQueries(taxonomy).find((row)=>row.id==='external_ids');
          const url=new URL('https://qlever.dev/api/wikidata');
          url.searchParams.set('query',spec.query);
          const response=await fetch(url,{headers:{
            Accept:'text/tab-separated-values',
            'User-Agent':'Graph1ks-RhymeLab-QLever-Fix-Probe/1.0',
          }});
          if(!response.ok) throw new Error(`HTTP ${response.status}: ${(await response.text()).slice(0,1000)}`);
          let bytes=0, breaks=0;
          for await(const value of response.body){
            const chunk=Buffer.from(value);
            bytes+=chunk.length;
            for(let offset=0;(offset=chunk.indexOf(10,offset))!==-1;offset+=1) breaks+=1;
          }
          console.log(JSON.stringify({rows:Math.max(0,breaks-1),raw_bytes:bytes,query_sha256:spec.query.length}));
          NODE

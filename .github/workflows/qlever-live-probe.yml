name: QLever Final Sitelink Probe

on:
  push:
    branches: [qlever-live-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Export Wikipedia sitelinks with backoff
        shell: bash
        run: |
          cat > /tmp/qlever_sitelinks.py <<'PY'
          import gzip, hashlib, json, os, time, urllib.error, urllib.parse, urllib.request
          ENDPOINT="https://qlever.dev/api/wikidata"
          TAXONOMY=[
            ("P106","Q2252262"),("P106","Q639669"),("P106","Q33999"),("P106","Q2526255"),
            ("P31","Q215380"),("P31","Q10429667"),("P31","Q1941779"),("P31","Q4830453"),
            ("P31","Q11424"),("P31","Q7889"),("P31","Q482994"),("P31","Q7366"),("P31","Q95074")
          ]
          PREFIX="""PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX p: <http://www.wikidata.org/prop/>
          PREFIX ps: <http://www.wikidata.org/prop/statement/>
          PREFIX schema: <http://schema.org/>
          PREFIX wikibase: <http://wikiba.se/ontology#>
          """
          branches=[]
          for prop,qid in TAXONOMY:
            v=f"?s_{prop}_{qid}"
            branches.append("{ ?item p:"+prop+" "+v+" . "+v+" ps:"+prop+" wd:"+qid+" . }")
          union=" UNION ".join(branches)
          q=PREFIX+f"""
          SELECT DISTINCT ?item ?site WHERE {{
            {union}
            ?article schema:about ?item ;
                     schema:isPartOf ?site .
            ?site wikibase:wikiGroup "wikipedia" .
          }}
          """
          url=ENDPOINT+"?"+urllib.parse.urlencode({"query":q})
          headers={"Accept":"text/tab-separated-values","User-Agent":"Graph1ks-RhymeLab-QLever-Probe/1.0"}
          path="/tmp/wiki_pairs.tsv"
          for attempt in range(1,6):
            try:
              req=urllib.request.Request(url,headers=headers)
              t=time.time(); rows=0; raw=0; sha=hashlib.sha256()
              with urllib.request.urlopen(req,timeout=900) as r, open(path,"wb") as out:
                ctype=r.headers.get("Content-Type")
                while True:
                  chunk=r.read(1024*1024)
                  if not chunk: break
                  out.write(chunk); sha.update(chunk); raw+=len(chunk); rows+=chunk.count(b"\n")
              rows=max(0,rows-1)
              gz=path+".gz"
              with open(path,"rb") as src,gzip.open(gz,"wb",compresslevel=6) as dst:
                while True:
                  chunk=src.read(1024*1024)
                  if not chunk: break
                  dst.write(chunk)
              print("WIKIPEDIA_PAIRS",json.dumps({
                "rows":rows,"raw_bytes":raw,"gzip_bytes":os.path.getsize(gz),
                "sha256":sha.hexdigest(),"elapsed_s":round(time.time()-t,3),"content_type":ctype
              },sort_keys=True),flush=True)
              break
            except urllib.error.HTTPError as e:
              if e.code != 429 or attempt == 5: raise
              delay=int(e.headers.get("Retry-After") or (15*attempt))
              print("RATE_LIMIT",attempt,"sleep_s",delay,flush=True)
              time.sleep(delay)
          PY
          python /tmp/qlever_sitelinks.py

name: QLever Rank Semantics Probe

on:
  push:
    branches: [qlever-live-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare truthy and all-statement taxonomy semantics
        shell: bash
        run: |
          cat > /tmp/qlever_rank_probe.py <<'PY'
          import gzip, json, os, time, urllib.parse, urllib.request

          ENDPOINT = "https://qlever.dev/api/wikidata"
          TAXONOMY = [
              ("P106", "Q2252262", "person.rapper"),
              ("P106", "Q639669", "person.musician"),
              ("P106", "Q33999", "person.actor"),
              ("P106", "Q2526255", "person.director"),
              ("P31", "Q215380", "group.music_group"),
              ("P31", "Q10429667", "organization.car_brand"),
              ("P31", "Q1941779", "organization.fashion_house"),
              ("P31", "Q4830453", "organization.company"),
              ("P31", "Q11424", "work.film"),
              ("P31", "Q7889", "work.video_game"),
              ("P31", "Q482994", "work.album"),
              ("P31", "Q7366", "work.song"),
              ("P31", "Q95074", "fictional.character"),
          ]
          PREFIX = """PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX wdt: <http://www.wikidata.org/prop/direct/>
          PREFIX p: <http://www.wikidata.org/prop/>
          PREFIX ps: <http://www.wikidata.org/prop/statement/>
          PREFIX schema: <http://schema.org/>
          """

          def fetch_json(query):
              url = ENDPOINT + "?" + urllib.parse.urlencode({"query": query})
              req = urllib.request.Request(url, headers={
                  "Accept": "application/sparql-results+json",
                  "User-Agent": "Graph1ks-RhymeLab-QLever-Probe/1.0",
              })
              t=time.time()
              with urllib.request.urlopen(req, timeout=600) as r:
                  payload=json.load(r)
              return payload["results"]["bindings"], time.time()-t

          def count(pattern):
              rows, elapsed = fetch_json(PREFIX + f"SELECT (COUNT(DISTINCT ?item) AS ?count) WHERE {{ {pattern} }}")
              return int(rows[0]["count"]["value"]), elapsed

          truthy_total_branches=[]
          all_total_branches=[]
          print("category\ttruthy\tall_statements\tdelta\ttruthy_s\tall_s")
          for prop,qid,cat in TAXONOMY:
              truthy=f"?item wdt:{prop} wd:{qid} ."
              allstmt=f"?item p:{prop} ?statement . ?statement ps:{prop} wd:{qid} ."
              a,ta=count(truthy)
              b,tb=count(allstmt)
              print(f"{cat}\t{a}\t{b}\t{b-a}\t{ta:.3f}\t{tb:.3f}")
              truthy_total_branches.append("{ "+truthy+" }")
              all_total_branches.append("{ "+allstmt+" }")

          truthy_union=" UNION ".join(truthy_total_branches)
          all_union=" UNION ".join(all_total_branches)
          tcount,tt=count(truthy_union)
          acount,at=count(all_union)
          print(f"TOTAL_DISTINCT\t{tcount}\t{acount}\t{acount-tcount}\t{tt:.3f}\t{at:.3f}")

          # Current endpoint freshness marker used by WDQS/QLever-compatible graphs.
          rows, elapsed = fetch_json(PREFIX + 'SELECT ?modified WHERE { <http://www.wikidata.org> schema:dateModified ?modified } ORDER BY DESC(?modified) LIMIT 5')
          print("DATE_MODIFIED", json.dumps(rows, ensure_ascii=False), f"elapsed_s={elapsed:.3f}")
          PY
          python /tmp/qlever_rank_probe.py

name: QLever Exact Stage Viability Probe

on:
  push:
    branches: [qlever-live-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Measure exact current-stage exports
        shell: bash
        run: |
          cat > /tmp/qlever_exact_probe.py <<'PY'
          import gzip, hashlib, json, os, time, urllib.parse, urllib.request

          ENDPOINT = "https://qlever.dev/api/wikidata"
          TAXONOMY = [
              ("P106", "Q2252262", "person.rapper"),
              ("P106", "Q639669", "person.musician"),
              ("P106", "Q33999", "person.actor"),
              ("P106", "Q2526255", "person.director"),
              ("P31", "Q215380", "group.music_group"),
              ("P31", "Q10429667", "organization.car_brand"),
              ("P31", "Q1941779", "organization.fashion_house"),
              ("P31", "Q4830453", "organization.company"),
              ("P31", "Q11424", "work.film"),
              ("P31", "Q7889", "work.video_game"),
              ("P31", "Q482994", "work.album"),
              ("P31", "Q7366", "work.song"),
              ("P31", "Q95074", "fictional.character"),
          ]
          PREFIX = """PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX p: <http://www.wikidata.org/prop/>
          PREFIX ps: <http://www.wikidata.org/prop/statement/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
          PREFIX schema: <http://schema.org/>
          PREFIX wikibase: <http://wikiba.se/ontology#>
          """

          def all_rank_branch(prop, qid, bind=None):
              b = f' BIND("{bind}" AS ?category)' if bind else ""
              return "{ ?item p:" + prop + " ?stmt_" + prop + "_" + qid + " . ?stmt_" + prop + "_" + qid + " ps:" + prop + " wd:" + qid + " ." + b + " }"

          membership_union = "\nUNION\n".join(
              all_rank_branch(prop, qid, cat) for prop, qid, cat in TAXONOMY
          )
          candidate_union = "\nUNION\n".join(
              all_rank_branch(prop, qid) for prop, qid, _ in TAXONOMY
          )

          def stream(query, path):
              params=urllib.parse.urlencode({"query":query})
              req=urllib.request.Request(
                  ENDPOINT+"?"+params,
                  headers={"Accept":"text/tab-separated-values","User-Agent":"Graph1ks-RhymeLab-QLever-Probe/1.0"},
              )
              started=time.time()
              sha=hashlib.sha256()
              rows=0
              size=0
              with urllib.request.urlopen(req, timeout=900) as r, open(path,"wb") as out:
                  ctype=r.headers.get("Content-Type")
                  while True:
                      chunk=r.read(1024*1024)
                      if not chunk: break
                      out.write(chunk); sha.update(chunk)
                      size += len(chunk); rows += chunk.count(b"\n")
              rows=max(0,rows-1)
              gz=path+".gz"
              with open(path,"rb") as src, gzip.open(gz,"wb",compresslevel=6) as dst:
                  while True:
                      chunk=src.read(1024*1024)
                      if not chunk: break
                      dst.write(chunk)
              return {
                  "rows":rows, "raw_bytes":size, "gzip_bytes":os.path.getsize(gz),
                  "sha256":sha.hexdigest(), "elapsed_s":round(time.time()-started,3),
                  "content_type":ctype,
              }

          exports={}

          membership_q=PREFIX+f"""
          SELECT DISTINCT ?item ?category WHERE {{
            {membership_union}
          }}
          """
          exports["membership"]=stream(membership_q,"/tmp/membership_all.tsv")
          print("EXPORT membership",json.dumps(exports["membership"],sort_keys=True),flush=True)

          core_q=PREFIX+f"""
          SELECT DISTINCT ?item ?labelDe ?labelEn ?descriptionDe ?descriptionEn ?statementCount WHERE {{
            {candidate_union}
            OPTIONAL {{ ?item rdfs:label ?labelDe . FILTER(LANG(?labelDe)="de") }}
            OPTIONAL {{ ?item rdfs:label ?labelEn . FILTER(LANG(?labelEn)="en") }}
            OPTIONAL {{ ?item schema:description ?descriptionDe . FILTER(LANG(?descriptionDe)="de") }}
            OPTIONAL {{ ?item schema:description ?descriptionEn . FILTER(LANG(?descriptionEn)="en") }}
            OPTIONAL {{ ?item wikibase:statements ?statementCount }}
          }}
          """
          exports["core"]=stream(core_q,"/tmp/core_all.tsv")
          print("EXPORT core",json.dumps(exports["core"],sort_keys=True),flush=True)

          alias_q=PREFIX+f"""
          SELECT DISTINCT ?item ?language ?alias WHERE {{
            {candidate_union}
            ?item skos:altLabel ?alias .
            FILTER(LANG(?alias) IN ("de","en"))
            BIND(LANG(?alias) AS ?language)
          }}
          """
          exports["aliases"]=stream(alias_q,"/tmp/aliases_all.tsv")
          print("EXPORT aliases",json.dumps(exports["aliases"],sort_keys=True),flush=True)

          ext_q=PREFIX+f"""
          SELECT DISTINCT ?item ?propertyId ?value WHERE {{
            {candidate_union}
            {{
              ?item p:P434 ?x1 . ?x1 ps:P434 ?value . BIND("P434" AS ?propertyId)
            }} UNION {{
              ?item p:P345 ?x2 . ?x2 ps:P345 ?value . BIND("P345" AS ?propertyId)
            }} UNION {{
              ?item p:P1953 ?x3 . ?x3 ps:P1953 ?value . BIND("P1953" AS ?propertyId)
            }} UNION {{
              ?item p:P1902 ?x4 . ?x4 ps:P1902 ?value . BIND("P1902" AS ?propertyId)
            }}
          }}
          """
          exports["external_ids"]=stream(ext_q,"/tmp/external_all.tsv")
          print("EXPORT external_ids",json.dumps(exports["external_ids"],sort_keys=True),flush=True)

          wiki_q=PREFIX+f"""
          SELECT ?item
                 (COUNT(DISTINCT ?site) AS ?wikipediaSitelinkCount)
                 (MAX(?isDe) AS ?hasDewiki)
                 (MAX(?isEn) AS ?hasEnwiki)
          WHERE {{
            {candidate_union}
            ?article schema:about ?item ; schema:isPartOf ?site .
            FILTER(REGEX(STR(?site), "^https://[^/]+\\.wikipedia\\.org/$"))
            BIND(IF(?site=<https://de.wikipedia.org/>,1,0) AS ?isDe)
            BIND(IF(?site=<https://en.wikipedia.org/>,1,0) AS ?isEn)
          }}
          GROUP BY ?item
          """
          exports["wikipedia_metrics"]=stream(wiki_q,"/tmp/wiki_metrics.tsv")
          print("EXPORT wikipedia_metrics",json.dumps(exports["wikipedia_metrics"],sort_keys=True),flush=True)

          # Current stage keeps an entity only if at least one DE/EN label or alias exists.
          eligible_q=PREFIX+f"""
          SELECT (COUNT(DISTINCT ?item) AS ?eligible) WHERE {{
            {candidate_union}
            {{ ?item rdfs:label ?name . }} UNION {{ ?item skos:altLabel ?name . }}
            FILTER(LANG(?name) IN ("de","en"))
          }}
          """
          params=urllib.parse.urlencode({"query":eligible_q})
          req=urllib.request.Request(ENDPOINT+"?"+params,headers={
              "Accept":"application/sparql-results+json","User-Agent":"Graph1ks-RhymeLab-QLever-Probe/1.0"
          })
          with urllib.request.urlopen(req,timeout=600) as r:
              payload=json.load(r)
          eligible=int(payload["results"]["bindings"][0]["eligible"]["value"])
          print("NAME_ELIGIBLE",eligible,flush=True)

          raw_total=sum(v["raw_bytes"] for v in exports.values())
          gz_total=sum(v["gzip_bytes"] for v in exports.values())
          wall_sum=sum(v["elapsed_s"] for v in exports.values())
          print("TOTAL_RAW_BYTES",raw_total,flush=True)
          print("TOTAL_GZIP_BYTES",gz_total,flush=True)
          print("SUM_EXPORT_ELAPSED_S",round(wall_sum,3),flush=True)
          print("SUMMARY",json.dumps({
              "name_eligible":eligible,
              "total_raw_bytes":raw_total,
              "total_gzip_bytes":gz_total,
              "sum_export_elapsed_s":round(wall_sum,3),
              "exports":exports,
          },sort_keys=True),flush=True)
          PY
          python /tmp/qlever_exact_probe.py

name: QLever Remaining Exact Fields Probe

on:
  push:
    branches: [qlever-live-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Measure exact Wikipedia sitelinks and name eligibility
        shell: bash
        run: |
          cat > /tmp/qlever_remaining.py <<'PY'
          import gzip, hashlib, json, os, time, urllib.parse, urllib.request
          ENDPOINT="https://qlever.dev/api/wikidata"
          TAXONOMY=[
            ("P106","Q2252262"),("P106","Q639669"),("P106","Q33999"),("P106","Q2526255"),
            ("P31","Q215380"),("P31","Q10429667"),("P31","Q1941779"),("P31","Q4830453"),
            ("P31","Q11424"),("P31","Q7889"),("P31","Q482994"),("P31","Q7366"),("P31","Q95074")
          ]
          PREFIX="""PREFIX wd: <http://www.wikidata.org/entity/>
          PREFIX p: <http://www.wikidata.org/prop/>
          PREFIX ps: <http://www.wikidata.org/prop/statement/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
          PREFIX schema: <http://schema.org/>
          PREFIX wikibase: <http://wikiba.se/ontology#>
          """
          branches=[]
          for prop,qid in TAXONOMY:
            v=f"?s_{prop}_{qid}"
            branches.append("{ ?item p:"+prop+" "+v+" . "+v+" ps:"+prop+" wd:"+qid+" . }")
          union=" UNION ".join(branches)

          def json_query(q):
            url=ENDPOINT+"?"+urllib.parse.urlencode({"query":q})
            req=urllib.request.Request(url,headers={"Accept":"application/sparql-results+json","User-Agent":"Graph1ks-RhymeLab-QLever-Probe/1.0"})
            t=time.time()
            with urllib.request.urlopen(req,timeout=900) as r: data=json.load(r)
            return data["results"]["bindings"],time.time()-t

          eligible_q=PREFIX+f"""
          SELECT (COUNT(DISTINCT ?item) AS ?count) WHERE {{
            {union}
            {{ ?item rdfs:label ?name . }} UNION {{ ?item skos:altLabel ?name . }}
            FILTER(LANG(?name) IN ("de","en"))
          }}
          """
          rows,elapsed=json_query(eligible_q)
          print("NAME_ELIGIBLE",rows[0]["count"]["value"],"elapsed_s",round(elapsed,3),flush=True)

          missing_statement_q=PREFIX+f"""
          SELECT (COUNT(DISTINCT ?item) AS ?count) WHERE {{
            {union}
            FILTER NOT EXISTS {{ ?item wikibase:statements ?statementCount }}
          }}
          """
          rows,elapsed=json_query(missing_statement_q)
          print("MISSING_WIKIBASE_STATEMENT_COUNT",rows[0]["count"]["value"],"elapsed_s",round(elapsed,3),flush=True)

          q=PREFIX+f"""
          SELECT DISTINCT ?item ?site WHERE {{
            {union}
            ?article schema:about ?item ; schema:isPartOf ?site .
            FILTER(REGEX(STR(?site), "^https://[^/]+\\.wikipedia\\.org/$"))
          }}
          """
          url=ENDPOINT+"?"+urllib.parse.urlencode({"query":q})
          req=urllib.request.Request(url,headers={"Accept":"text/tab-separated-values","User-Agent":"Graph1ks-RhymeLab-QLever-Probe/1.0"})
          t=time.time(); rows_n=0; raw=0; sha=hashlib.sha256()
          path="/tmp/wiki_pairs.tsv"
          with urllib.request.urlopen(req,timeout=900) as r, open(path,"wb") as out:
            ctype=r.headers.get("Content-Type")
            while True:
              chunk=r.read(1024*1024)
              if not chunk: break
              out.write(chunk); sha.update(chunk); raw+=len(chunk); rows_n+=chunk.count(b"\n")
          rows_n=max(0,rows_n-1)
          gz=path+".gz"
          with open(path,"rb") as src,gzip.open(gz,"wb",compresslevel=6) as dst:
            while True:
              chunk=src.read(1024*1024)
              if not chunk: break
              dst.write(chunk)
          print("WIKIPEDIA_PAIRS",json.dumps({
            "rows":rows_n,"raw_bytes":raw,"gzip_bytes":os.path.getsize(gz),
            "sha256":sha.hexdigest(),"elapsed_s":round(time.time()-t,3),"content_type":ctype
          },sort_keys=True),flush=True)
          PY
          python /tmp/qlever_remaining.py
